name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # AR-09: the API's types are generated from its OpenAPI document, never edited by hand.
      - name: Types match the API's OpenAPI document (AR-09)
        run: npm run types:api && git diff --exit-code -- src/types/api.ts
      - run: npm run lint
      - run: npm run lint:arch
      - run: npm test
      - name: npm run build (tsc -b and vite build)
        run: npm run build
      # VLW-24: axe, 360 px and the keyboard on every page, in a real browser against the built app. Steps of
      # this job rather than a job of their own, so the check main requires covers them.
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
      - run: npm audit --audit-level=high
