name: Image

# Builds and smoke-tests the image on every pull request. On main and on a release tag it also publishes it to
# GHCR for amd64 and arm64, so the API's Compose can run it behind Caddy (VLW-25, the API's VLA-27).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# A newer pull request run replaces an older one; a publish on main always finishes, so no sha- tag goes missing.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Used only by the sign-in below, which runs on a push and never on a pull request.
      packages: write
    steps:
      # Pinned by commit, since this job can write packages
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for amd64 and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: veriledger-webapp:ci
      - name: Smoke-test the image
        run: |
          docker run -d --name web -p 8080:8080 veriledger-webapp:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          sh docker/smoke-test.sh http://127.0.0.1:8080
      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Lower case: GHCR refuses the owner's capital letter
          images: ghcr.io/alesso2805/veriledger-webapp
          # main and sha-<commit> on every push to main; the version (1.0.0, 1.0) on a release tag (VLW-26)
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build for amd64 and arm64, and publish it on a push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
